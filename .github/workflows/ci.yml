name: CI

# This file is for GITHUB ONLY. Forgejo is the primary forge and has its own
# pipeline at .forgejo/workflows/ci.yml, shaped around a runner that has no
# preinstalled toolchain — see the comments there.
#
# Forgejo reads `.github/workflows` as well, so without the `if:` guard on every
# job below, each push would also fire this file on the Forgejo runner, where
# `ubuntu-latest` matches no label at all. That does not fail: it QUEUES, forever,
# showing a run that is permanently in progress. The guard compares the server
# URL, which is the one value that reliably differs between the two forges.
#
# Keep the two files in step. They deliberately assert the same things — the same
# fmt, clippy, test, check and secret scan — and are allowed to differ only in how
# they obtain a toolchain.

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the previous run — CI minutes are not free
# and a superseded result is noise.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    if: ${{ github.server_url == 'https://github.com' }}
    steps:
      - uses: actions/checkout@v4
      # No toolchain input: rust-toolchain.toml is authoritative, so CI and a laptop
      # cannot silently use different compilers.
      - uses: dtolnay/rust-toolchain@1.97
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  web:
    runs-on: ubuntu-latest
    if: ${{ github.server_url == 'https://github.com' }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npx vitest run
      - run: npm run build

  secrets:
    runs-on: ubuntu-latest
    if: ${{ github.server_url == 'https://github.com' }}
    steps:
      # No fetch-depth: 0. The scan is `git grep` with no revision — it reads the
      # working tree and never touches history, so a full clone bought only
      # download time.
      - uses: actions/checkout@v4
      # Proving the gate can still fail is part of the gate. A scanner that has
      # quietly stopped matching anything looks exactly like a clean repository.
      - name: The scanner classifies known shapes correctly
        run: ./scripts/scan-secrets.sh --self-test

      - name: Fail if a credential-shaped value is committed
        run: ./scripts/scan-secrets.sh scan
