[package]
name = "gw-api"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "gw_api"
path = "src/lib.rs"

[[bin]]
name = "great-wiki"
path = "src/main.rs"

[dependencies]
gw-auth = { path = "../gw-auth" }
gw-collab = { path = "../gw-collab" }
gw-core = { path = "../gw-core" }
gw-store = { path = "../gw-store" }
anyhow = { workspace = true }
# `ws` for the collaboration endpoint. It is the only feature added here, and it brings
# `tokio-tungstenite` with it — which the collaboration tests then use as a CLIENT, pinned
# to the same version in `dev-dependencies` so the suite cannot end up speaking a different
# protocol implementation from the one the server compiled against.
axum = { version = "0.8", features = ["ws"] }
# Cookies only. The session cookie is how a request names its principal, and parsing a
# `Cookie:` header by hand is a small thing to get subtly wrong for something that decides
# who somebody is.
axum-extra = { version = "0.10", default-features = false, features = ["cookie"] }
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
# `StreamExt::split`, so one task can read a socket and write to it from the same select
# loop. `futures-util` rather than the `futures` facade the M3 plan named: the facade adds
# an executor, a channel implementation and `futures-task` for one method, and axum has
# already put this exact crate in the tree.
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# ID-token verification. Pure-Rust backend (`rust_crypto`) rather than `aws_lc_rs`: no C
# toolchain in the build, and `rsa` is already in the tree.
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto", "use_pem"] }
# `OsRng` for session tokens and PKCE secrets. Never a seeded or thread-local PRNG for
# anything an attacker may guess.
rand = "0.8"
# Discovery, the token endpoint, JWKS and userinfo. rustls so the build needs no system
# OpenSSL, and the bundled Mozilla roots rather than the OS trust store so a container
# with an empty `/etc/ssl/certs` fails at build time rather than at first login. No
# cookie store and no redirect following: a token exchange follows nothing.
reqwest = { version = "0.13", default-features = false, features = ["charset", "form", "http2", "json", "rustls-no-provider", "webpki-roots"] }
# rustls' default provider is `aws-lc-rs`, which needs CMake and a C toolchain to build.
# `ring` needs neither, so the provider is chosen here and installed explicitly in
# `OidcClient::new` rather than left to whatever happens to be linked in.
rustls = { version = "0.23", default-features = false, features = ["logging", "ring", "std", "tls12"] }
serde = { workspace = true }
serde_json = { workspace = true }
# The export writes YAML frontmatter. Serialised through the same library the importer
# parses it with, so a title holding a colon, a quote or a leading `-` is quoted by the
# rules that will read it back rather than by a format string that guesses.
serde_yaml = { workspace = true }
sha2 = "0.10"
# sqlx is a DIRECT dependency because handlers query. The predecessor plan omitted it
# from this crate's manifest while calling sqlx from four of its modules.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
# Constant-time byte comparison for the proxy secret. `==` short-circuits on the first
# differing byte, which times how much of a guess was right; `subtle` does not.
subtle = "2"
thiserror = { workspace = true }
# Cookie lifetimes. `axum-extra`'s cookie support is the `cookie` crate, which expresses
# `Max-Age` as a `time::Duration`; this is that crate, not a second time library.
time = "0.3"
tokio = { workspace = true }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "limit"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = "2.5"

[dev-dependencies]
# A stand-in identity provider for the login tests: a real RSA key, generated per test
# run rather than committed, so no private key ever lives in this public repository.
rsa = "0.9"
tempfile = "3"
tokio = { workspace = true }
# The WebSocket CLIENT the collaboration tests drive the endpoint with. A refusal that is
# a CLOSE frame rather than a status code can only be observed over a real socket, so
# those tests bind a real listener instead of calling the router in-process.
#
# Pinned to the version `axum`'s `ws` feature already brings in. Two versions of it would
# compile twice and, worse, would mean the suite proves an interop property against an
# implementation the server does not use.
tokio-tungstenite = "0.29"
tower = { version = "0.5", features = ["util"] }
# Inline MARKS, for the tests that prove they survive the CRDT state and are lost by a
# revision. `gw_collab::CollabDoc` deliberately exposes no way to write one — its surface
# is the block tree, which is precisely what cannot express a mark — so the test builds the
# update a browser would send with the same CRDT library the server runs. Pinned to the
# version `gw-collab` already depends on, or the suite would prove an interop property
# against an implementation the server does not use.
yrs = "0.27"
