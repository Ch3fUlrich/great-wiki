[package]
name = "gw-store"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
gw-auth = { path = "../gw-auth" }
gw-core = { path = "../gw-core" }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The content address of every blob. See `crate::blobs`.
sha2 = { workspace = true }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tokio = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true }
# For `the_permission_question_is_asked_once_per_document_not_once_per_edge`, which counts
# the `sqlx::query` tracing events one `graph_for` emits. Already a workspace dependency
# (gw-api uses it), so this adds nothing to the tree that was not being built anyway.
tracing-subscriber = { workspace = true }
