[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/Ch3fUlrich/great-wiki"

# Versions live here so a crate never pins its own and they cannot drift apart.
[workspace.dependencies]
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
# CommonMark parsing for the importer and the export round-trip. `default-features = false`
# drops the HTML renderer and its `getopts`/`bitflags` CLI baggage: we build a Block tree
# from the event stream and must never grow a second, HTML-shaped rendering path.
pulldown-cmark = { version = "0.12", default-features = false }
tokio = { version = "1", features = ["full"] }
# Myers diffing for the revision history. `gw-core` turns two block trees into three
# kinds of change list with it; nothing else in the workspace diffs anything.
similar = "2"

tracing = "0.1"
url = "2.5"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# The login tests generate a real RSA key rather than committing one to a public
# repository, and unoptimised primality testing takes tens of seconds. Optimising these
# two packages only keeps `cargo test` quick without optimising the code under test,
# which would make a debugger and a backtrace worse for everything else.
[profile.dev.package.rsa]
opt-level = 3

[profile.dev.package.num-bigint-dig]
opt-level = 3

# The same trade for the same reason, and the numbers are worse: argon2id at Authelia's
# parameters costs about 1.6 s per hash unoptimised and about 0.1 s optimised, so gw-auth's
# password tests alone took sixteen seconds to prove things about a function that runs in a
# tenth of that in production. This changes NOTHING about the parameters — `[profile.dev]`
# does not exist in a release build, and `HashingCost::PRODUCTION` is a value in the source
# either way. It only stops the debug build from being thirty times slower than the thing
# it is testing.
[profile.dev.package.argon2]
opt-level = 3

# argon2's inner compression function. Optimising argon2 without it leaves most of the cost
# where it was.
[profile.dev.package.blake2]
opt-level = 3
