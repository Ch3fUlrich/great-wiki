# Serena project configuration for great-wiki.
#
# WHY THE LANGUAGE LIST IS SHORT AND CONSERVATIVE:
# A language whose server is not present in the running serena-mcp image does NOT
# degrade to "no symbols for that language". Its `initialize` fails, the language
# server MANAGER fails with it, and EVERY symbol tool then errors with
# "The language server manager is not initialized" -- naming neither the language
# nor the cause. The repo goes dark. `markdown` is the classic offender (its
# marksman LSP crashes the image) and is deliberately absent below.
#
# Proven working in the current image: bash, json, python, rust, toml, yaml.
#
# TYPESCRIPT/SVELTE ARE NOT LISTED YET -- ON PURPOSE.
# This project has a large TypeScript + Svelte frontend under web/, so semantic
# navigation there would be valuable. But adding an unsupported language takes the
# WHOLE server down, so it must be verified against the running image first:
#   docker exec serena-mcp ls <language-servers-dir>   # confirm ts server present
# Add "typescript" here only after that check passes, then RESTART serena-mcp.
# Until then, use the built-in Read/Grep tools for web/.
languages: ["rust", "toml", "yaml", "json", "bash", "python"]

encoding: "utf-8"

# Serena refuses gitignored files ("Path <p> is ignored; cannot access for safety
# reasons"). That is a guardrail, not a bug -- use built-in Read/Edit for those
# rather than un-ignoring the file.
ignore_all_files_in_gitignore: true

ls_specific_settings: {}
additional_workspace_folders: []
ignored_paths: []
read_only: false
excluded_tools: []
included_optional_tools: []
fixed_tools: []
read_only_memory_patterns: []
ignored_memory_patterns: []
